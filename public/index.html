<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SJL Studio - 마피아 게임</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- LOBBY -->
  <section id="screen-lobby" class="screen active">
    <div class="lobby-container">
      <div class="logo">
        <h1>🔪 마피아 게임</h1>
        <p class="subtitle">SJL Studio</p>
      </div>
      <div class="form-group">
        <input type="text" id="playerName" placeholder="닉네임을 입력하세요" maxlength="8" autocomplete="off">
      </div>
      <div class="button-group">
        <button id="btnCreate" class="btn btn-primary">방 만들기</button>
        <div class="divider"><span>또는</span></div>
        <div class="join-group">
          <input type="text" id="roomCode" placeholder="방 코드" maxlength="6" autocomplete="off">
          <button id="btnJoin" class="btn btn-secondary">참가하기</button>
        </div>
      </div>
      <p id="lobbyError" class="error-text"></p>
    </div>
  </section>

  <!-- ROOM -->
  <section id="screen-room" class="screen">
    <div class="room-container">
      <div class="room-header">
        <button id="btnLeave" class="btn btn-small btn-danger">나가기</button>
        <div class="room-code-display">
          <span class="label">방 코드</span>
          <span id="displayRoomCode" class="code"></span>
          <button id="btnCopy" class="btn btn-small" title="복사">📋</button>
        </div>
      </div>
      <div class="player-list-room">
        <h3>플레이어 <span id="playerCount">0</span>/12</h3>
        <ul id="roomPlayerList"></ul>
      </div>
      <!-- Settings (host only) -->
      <div class="role-settings" id="roleSettings" style="display:none">
        <h3>역할 설정</h3>
        <div class="setting-row">
          <div class="setting-label">🔪 마피아</div>
          <div class="setting-control">
            <button class="btn btn-small btn-setting" id="mafiaDown">-</button>
            <span id="mafiaCountDisplay" class="setting-value">1</span>
            <button class="btn btn-small btn-setting" id="mafiaUp">+</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label">💉 의사</div>
          <div class="setting-control">
            <button class="btn btn-small btn-toggle on" id="doctorToggle">ON</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label">🔍 경찰</div>
          <div class="setting-control">
            <button class="btn btn-small btn-toggle on" id="policeToggle">ON</button>
          </div>
        </div>
        <div class="role-preview" id="rolePreview"></div>
      </div>

      <div class="room-footer">
        <p class="hint">최소 4명이 필요합니다</p>
        <button id="btnStart" class="btn btn-primary btn-large" style="display:none">게임 시작</button>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen">
    <div class="game-container">
      <!-- Header -->
      <div class="game-header">
        <div class="phase-info">
          <span id="phaseIcon" class="phase-icon">☀️</span>
          <span id="phaseName" class="phase-name">낮</span>
          <span id="dayCount" class="day-count"></span>
        </div>
        <div class="timer-display">
          <span id="timerValue" class="timer-value">60</span>
          <span class="timer-label">초</span>
        </div>
        <div class="role-badge" id="roleBadge">
          <span id="roleEmoji"></span>
          <span id="roleName"></span>
        </div>
      </div>

      <!-- AI Messages -->
      <div class="ai-messages" id="aiMessages"></div>

      <!-- Action Area -->
      <div class="action-area" id="actionArea"></div>

      <!-- Player Grid -->
      <div class="player-grid-container">
        <h4>플레이어</h4>
        <div class="player-grid" id="playerGrid"></div>
      </div>

      <!-- Chat -->
      <div class="chat-area">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
          <input type="text" id="chatInput" placeholder="메시지를 입력하세요..." maxlength="200" autocomplete="off" disabled>
          <button id="btnSend" class="btn btn-primary btn-small" disabled>전송</button>
        </div>
      </div>
    </div>

    <!-- Game Over Overlay -->
    <div class="game-over-overlay" id="gameOverOverlay" style="display:none">
      <div class="game-over-content">
        <h2 id="gameOverTitle"></h2>
        <div id="gameOverRoles" class="role-reveal-list"></div>
        <button id="btnBackToLobby" class="btn btn-primary btn-large">로비로 돌아가기</button>
      </div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
